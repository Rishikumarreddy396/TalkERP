services:
  postgres:
    image: postgres:16-alpine
    container_name: talkerp_db
    environment:
      POSTGRES_USER: talkerp
      POSTGRES_PASSWORD: password
      POSTGRES_DB: talkerp_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql

volumes:
  pgdata:
